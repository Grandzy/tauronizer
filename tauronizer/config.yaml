name: Tauronizer
version: "0.3.1"
slug: tauronizer
description: Porównywarka taryf energii elektrycznej Tauron na podstawie historii zużycia z Home Assistant.
url: https://github.com/direk/tauronizer
maintainer: direk
arch:
  - aarch64
  - amd64
startup: application
boot: auto
homeassistant: "2024.6.0"
ingress: true
ingress_port: 8099
panel_icon: mdi:transmission-tower
panel_title: Tauronizer
panel_admin: false
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8099]/health"
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
